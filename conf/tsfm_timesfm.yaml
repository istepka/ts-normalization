# TimesFM-1.0 (reduced config) forecasting pretraining on GiftEvalPretrain,
# loss-space comparison. See notes/05-timesfm-pretraining-loss-space-plan.md.
# Single source of truth; code accesses keys directly and fails if any is
# missing.

model: timesfm
device: cpu # cpu | cuda
condition: timesfm_native_original # timesfm_native_original | timesfm_normalized
experiment_kind: natural_mixture # natural_mixture | controlled_scale
scale_assignment: null # A | B, required when experiment_kind=controlled_scale
scale_b_low: 1.0
scale_b_high: 10.0

seed: 0
output_dir: outputs/tsfm_pretraining/timesfm

corpus:
  root: /zfsauton/scratch/istepka/lts/data/giftevalpretrain_full
  datasets: null # null = every univariate dataset found under corpus.root

window_index:
  context_length: 512 # 16 patches of patch_len=32
  prediction_length: 128 # must equal the TimesFM config's horizon_len
  stride: 512
  val_series_fraction: 0.1
  min_valid_fraction: 0.9
  base_seed: 0
  max_windows_per_series: null
  cache_path: null # if set, load/save the built index here instead of rebuilding

dataset_weights: null # null = uniform over datasets present in the index

timesfm:
  config_size: 17m # 17m (smoke test) | 70m (primary run)
  grad_clip_norm: 1.0
  normalization_mode: first_patch # first_patch | whole_context
  objective: combined # mse | combined

train:
  steps: 2000
  batch_size: 32
  lr: 1.0e-4
  optimizer: adamw
  deterministic: true
  schedule_seed: 0
  eval_every: 250
  # eval_batches * batch_size windows, natural-mixture proportion (fixed
  # across every checkpoint, see EVAL_SEED in train.py) -> feeds only the
  # pooled_global_error metric.
  eval_batches: 50
  # Up to this many windows from EVERY dataset in the val split (fewer if a
  # dataset's val pool is smaller), fixed across every checkpoint -> feeds
  # only the per-source Gini/unweighted-mean breakdown, so a dataset with few
  # validation windows isn't at the mercy of the natural-mixture sample's
  # (possibly high) probability of drawing zero of them. See train.py's
  # sample_stratified_eval_rows / notes/agentic_logs.
  eval_windows_per_dataset: 64
  # Insurance: cheap enough in disk (a handful of checkpoints per run, not
  # dozens) to keep, but frequent enough that a later change of mind about
  # validation sampling / metrics can be recomputed from a saved checkpoint
  # instead of re-running the full (expensive) training run.
  checkpoint_every: 2000

wandb:
  entity: ts-normalization
  project: tsfm_pretraining
  mode: online
  experiment: gifteval_timesfm
