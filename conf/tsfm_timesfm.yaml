defaults:
  - tsfm_base
  - _self_

# TimesFM-1.0 (reduced config) forecasting pretraining on GiftEvalPretrain,
# loss-space comparison. See notes/05-timesfm-pretraining-loss-space-plan.md.
# Single source of truth; code accesses keys directly and fails if any is
# missing.

model: timesfm
condition: timesfm_native_original # timesfm_native_original | timesfm_normalized
output_dir: outputs/tsfm_pretraining/timesfm

timesfm:
  config_size: 17m # 17m (smoke test) | 70m (primary run)
  grad_clip_norm: 1.0
  normalization_mode: first_patch # first_patch | whole_context
  objective: combined # mse | combined

train:
  steps: 2000
  batch_size: 32

wandb:
  experiment: gifteval_timesfm
