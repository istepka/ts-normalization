defaults:
  - tsfm_base
  - _self_

# MOMENT masked-reconstruction pretraining on GiftEvalPretrain, loss-space
# comparison. See notes/05-timesfm-pretraining-loss-space-plan.md. Single
# source of truth; code accesses keys directly and fails if any is missing.

model: moment
condition: moment_original # moment_normalized | moment_original
output_dir: outputs/${now:%Y-%m-%d}/experiments/tsfm_pretraining/moment/manual-${now:%H-%M-%S}

hydra:
  run:
    dir: ${output_dir}

moment:
  # MOMENT-base: matches the published flan-t5-base backbone dims (d_model,
  # t5_num_layers, t5_num_heads, t5_d_ff, t5_d_kv below are exactly
  # T5Config.from_pretrained("google/flan-t5-base")'s values) -> ~66M params.
  # t5_d_kv is the actual attention head dim in T5 (independent of
  # d_model/t5_num_heads, which need not divide evenly).
  context_length: 512
  patch_len: 8
  d_model: 768
  t5_num_layers: 12
  t5_num_heads: 12
  t5_d_ff: 2048
  t5_d_kv: 64
  mask_ratio: 0.3
  dropout: 0.1
  grad_clip_norm: 1.0

train:
  steps: 2000
  batch_size: 32

wandb:
  experiment: gifteval_moment
