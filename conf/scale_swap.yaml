defaults:
  - config
  - _self_

setups: [normalized, original]

data:
  kind: real_scale_swap
  scale_assignment: [1.0, 1.0, 1.0, 1.0, 10.0, 10.0, 10.0, 10.0]

model:
  d_model: 128
  n_heads: 8
  n_layers: 4
  dim_feedforward: 256

train:
  batch_size: 32
  lr: 1.0e-4
  # Divide by mean b^2 = (4 * 1 + 4 * 100) / 8 = 50.5.
  lr_adjusted: 1.9801980198e-6

plot:
  render: false

wandb:
  experiment: real_scale_swap_a
