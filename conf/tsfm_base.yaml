# Shared defaults for all GiftEvalPretrain TSFM runs.

device: cpu
experiment_kind: natural_mixture
scale_assignment: null
scale_b_low: 1.0
scale_b_high: 10.0
seed: 0

corpus:
  root: /zfsauton/scratch/istepka/lts/data/giftevalpretrain_full
  datasets: null
  # Held out for evaluation. M4 and GIFT-Eval are test sets that never
  # appear in GiftEvalPretrain; M1, M3, Tourism, and Favorita are test sets
  # that do, so they must be removed here. M1/M3/Tourism series are all
  # shorter than context 512 + prediction 128 and so contributed no windows
  # even before this list existed, but Favorita does contribute (78,034
  # windows, 0.19% of the index), so any index built before this list must
  # be rebuilt.
  exclude:
    - m1_yearly
    - m1_quarterly
    - m1_monthly
    - monash_m3_yearly
    - monash_m3_quarterly
    - monash_m3_monthly
    - monash_m3_other
    - tourism_yearly
    - tourism_quarterly
    - tourism_monthly
    - favorita_sales
    - favorita_transactions

window_index:
  context_length: 512
  prediction_length: 128
  stride: 512
  val_series_fraction: 0.1
  min_valid_fraction: 0.9
  base_seed: 0
  max_windows_per_series: null
  # Set together to admit series too short for the full geometry. A window
  # needs 64 context points and 8 horizon points, and takes up to the maxima
  # above wherever the series allows it. Left null the index is fixed-
  # geometry, which is what every run before 2026-08-18 trained on.
  min_context_length: null
  min_prediction_length: null
  cache_path: null

dataset_weights: null

train:
  schedule_steps: null
  lr: 1.0e-4
  optimizer: adamw
  deterministic: true
  schedule_seed: 0
  eval_every: 250
  eval_batches: 50
  eval_windows_per_dataset: 64
  checkpoint_every: 6000
  resume_from: null

wandb:
  entity: ts-normalization
  project: tsfm_pretraining
  mode: online
