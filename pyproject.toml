[project]
name = "ts-normalization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting==2.3.1",
    "datasets>=3.0.0",
    "hydra-core>=1.3.3",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=17.0.0",
    "scipy>=1.18.0",
    "torch>=2.12.0",
    "transformers>=4.45.0",
    "wandb>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import `main` and `src.*` from the repo root, so put it on sys.path
# rather than requiring PYTHONPATH=. on every invocation.
pythonpath = ["."]

[tool.ruff]
# Vendored third-party source (src/tsfm_pretraining/vendor/) is pinned to a
# specific upstream commit and must stay byte-for-byte reproducible against
# that commit (see each vendor subdir's REVISION file); exclude it from
# formatting/linting so tooling never mechanically drifts it from upstream.
extend-exclude = ["src/tsfm_pretraining/vendor"]
