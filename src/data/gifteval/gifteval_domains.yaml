# Dataset -> domain assignment for the GiftEvalPretrain corpus.
#
# The corpus's arrow files carry no per-dataset domain field (only item_id,
# start, freq, target per series), and no authoritative public per-directory
# domain table was found for GiftEvalPretrain specifically. The dataset card
# states the corpus spans "seven domains" aligned with GIFT-Eval; the exact
# seven-label taxonomy (Econ/Fin, Energy, Healthcare, Nature, Sales,
# Transport, Web/CloudOps) is confirmed by GIFT-Eval's own
# notebooks/dataset_properties.json for its 28 benchmark configs.
#
# This file assigns each of the 152 GiftEvalPretrain directories to one of
# those seven domains by dataset identity (source competition/archive/sensor
# network). Most assignments are unambiguous (e.g. PEMS03 -> Transport,
# era5_* -> Nature). A handful are genuinely uncertain from the name alone
# and are marked confidence: low; gifteval_corpus.py surfaces these in the
# audit output rather than silently trusting them. Frequency is NOT recorded
# here -- it is read per-series from the arrow data itself.
#
# gifteval_corpus.py fails loudly if a local dataset directory has no entry
# here (no silent default domain).

datasets:
  alibaba_cluster_trace_2018: {domain: Web/CloudOps, confidence: high}
  australian_electricity_demand: {domain: Energy, confidence: high}
  azure_vm_traces_2017: {domain: Web/CloudOps, confidence: high}
